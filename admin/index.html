<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>디톡스vs 관리자</title>
<style>
:root{--bg:#F3F5F8;--paper:#fff;--tx:#18212F;--tx2:#4A5567;--sub:#8D97A8;--line:#E6E9EE;--blue:#2557E6;--blue2:#1A3FB5;--soft:#EAF0FF;--red:#E5443A;--redsoft:#FDECEA;--ok:#0E9F6E;--oksoft:#E3F7EE;--warn:#B54708;--warnsoft:#FEF0C7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0}
.wrap{display:grid;grid-template-columns:208px 1fr;min-height:100vh}
nav{background:linear-gradient(170deg,var(--blue),var(--blue2));color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
nav .lg{font-size:21px;font-weight:800;padding:0 10px 18px;letter-spacing:-.3px}
nav .lg small{display:block;font-size:12px;font-weight:600;opacity:.7;margin-top:2px}
nav button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.78);font-weight:600}
nav button:hover{background:rgba(255,255,255,.1)}
nav button.on{background:#fff;color:var(--blue)}
nav .cnt{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#FFE066;color:#3B2F00;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
nav .sp{flex:1}
nav .who{font-size:12px;opacity:.75;padding:0 12px 6px;word-break:break-all}
main{padding:28px 32px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head h1{font-size:22px;font-weight:800;flex:1}
.card{background:var(--paper);border-radius:16px;padding:18px 20px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat .l{font-size:13px;color:var(--tx2);font-weight:600}
.stat .v{font-size:30px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.25}
.stat .s{font-size:12px;color:var(--sub)}
.stat.alert{box-shadow:inset 0 0 0 2px #FFD43B}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card h2{font-size:15px;font-weight:800;margin-bottom:2px}
.card .cap{font-size:12.5px;color:var(--sub);margin-bottom:10px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:150px;overflow:visible}
.chart .bar{fill:var(--blue)}
.chart .hit{fill:transparent}
.chart .hit:hover + .bar,.chart .bar.h{fill:var(--blue2)}
.chart text{font-size:11px;fill:var(--sub)}
.chart text.val{fill:var(--tx);font-weight:700}
.tip{position:absolute;pointer-events:none;background:var(--tx);color:#fff;font-size:12px;font-weight:600;padding:5px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);display:none}
.bar-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.inp{height:40px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;outline:none;min-width:0}
.inp:focus{border-color:var(--blue)}
textarea.inp{height:auto;padding:10px 12px;width:100%;resize:vertical;line-height:1.5}
.seg{display:inline-flex;background:#E9ECF1;border-radius:10px;padding:3px}
.seg button{padding:7px 12px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--tx2)}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.btn{height:40px;padding:0 16px;border-radius:10px;background:var(--blue);color:#fff;font-weight:700}
.btn:hover{background:var(--blue2)}
.btn.sec{background:#fff;color:var(--tx);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sec:hover{background:#F7F8FA}
.btn.bad{background:var(--red)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--sub);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.s{cursor:pointer}th.s:hover{color:var(--tx)}th.on{color:var(--blue)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
tr.row{cursor:pointer}tr.row:hover td{background:#F8FAFF}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto;margin:0 -8px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#EEF0F4;color:var(--tx2);white-space:nowrap}
.pill.b{background:var(--soft);color:var(--blue)}.pill.r{background:var(--redsoft);color:var(--red)}.pill.g{background:var(--oksoft);color:var(--ok)}.pill.w{background:var(--warnsoft);color:var(--warn)}
.sub{color:var(--sub);font-size:12.5px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--sub);word-break:break-all}
.fb{padding:14px 0;border-bottom:1px solid var(--line)}.fb:last-child{border-bottom:0}
.fb .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.fb .body{white-space:pre-wrap;word-break:break-word}
.fb .tg{margin-top:6px;font-size:13px;color:var(--tx2);background:#F7F8FA;border-radius:8px;padding:7px 10px}
.fb .act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.fb .note{flex:1;min-width:160px;height:32px;font-size:13px}
.pg{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px}
.empty{text-align:center;color:var(--sub);padding:36px 0}
.dr{position:fixed;inset:0;background:rgba(16,24,40,.4);display:none;justify-content:flex-end;z-index:10}
.dr.on{display:flex}
.dr .in{width:min(460px,100%);background:#fff;height:100%;overflow:auto;padding:24px}
.dr h2{font-size:19px;font-weight:800}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span:first-child{color:var(--tx2)}
.sec{margin-top:20px}.sec h3{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:6px}
.days{display:flex;gap:6px;align-items:flex-end;height:84px}
.days div{flex:1;text-align:center;font-size:11px;color:var(--sub);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.days i{display:block;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{width:min(380px,100%);padding:28px}
.login h1{font-size:24px;font-weight:800;color:var(--blue)}
.login label{display:block;font-size:13px;font-weight:700;color:var(--tx2);margin:14px 0 6px}
.login .inp{width:100%;height:46px}
.login .btn{width:100%;height:48px;margin-top:18px}
.err{color:var(--red);font-size:13.5px;margin-top:10px;min-height:20px}
.demo{background:#FFF4CC;color:#5C4400;font-size:13px;font-weight:600;padding:8px 14px;border-radius:10px;margin-bottom:14px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px}nav .lg{width:100%;padding-bottom:8px}nav button{width:auto}nav .sp,nav .who{display:none}main{padding:18px 14px 50px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div class="dr" id="dr"><div class="in" id="drIn"></div></div>
<div class="toast" id="toast"></div>
<script src="../config.js"></script>
<script>
(function () {
'use strict';
var $ = function (q) { return document.querySelector(q); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('on'); }, 2400); }
function fmtSec(s) { s = Math.round(s || 0); var m = Math.floor(s / 60), h = Math.floor(m / 60); return h ? h + '시간 ' + (m % 60) + '분' : m + '분'; }
function kst(t) { return new Date(new Date(t).getTime() + 9 * 3600e3); }
function dt(t) { if (!t) return '–'; var d = kst(t); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + ' ' + ('0' + d.getUTCHours()).slice(-2) + ':' + ('0' + d.getUTCMinutes()).slice(-2); }
function day(t) { var d = kst(t); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); }
function ago(t) { if (!t) return '기록 없음'; var s = (Date.now() - new Date(t).getTime()) / 1000; if (s < 90) return '방금'; if (s < 3600) return Math.floor(s / 60) + '분 전'; if (s < 86400) return Math.floor(s / 3600) + '시간 전'; return Math.floor(s / 86400) + '일 전'; }
var TN = { yt_shorts: '쇼츠', youtube: '유튜브', ig_reels: '릴스', instagram: '인스타', tiktok: '틱톡', games: '게임', facebook: '페이스북', x: 'X', threads: '스레드', internet: '인터넷', blind: '블라인드', kakao: '카카오톡' };

var CFG = window.DETOXVS || {}, DEMO = /[?&]demo/.test(location.search);
try { var saved = JSON.parse(localStorage.getItem('detoxvs_admin_cfg') || 'null'); if (saved && !CFG.supabaseUrl) CFG = saved; } catch (e) { }
var S = { view: 'home', tok: null, email: '', stats: null, fb: { kind: 'ask', status: 'new', off: 0 }, us: { q: '', sort: 'new', off: 0 }, gr: { q: '', off: 0 } };
try { var ss = JSON.parse(sessionStorage.getItem('detoxvs_admin') || 'null'); if (ss && ss.exp > Date.now()) { S.tok = ss.tok; S.email = ss.email; } } catch (e) { }
var PAGE = 50;

/* ---- 서버 호출 ---- */
function rpc(fn, args) {
  if (DEMO) return new Promise(function (res, rej) { setTimeout(function () { try { res(JSON.parse(JSON.stringify(demo[fn](args || {})))); } catch (e) { rej(e); } }, 80); });
  return fetch(CFG.supabaseUrl + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: CFG.anonKey, Authorization: 'Bearer ' + S.tok, 'Content-Type': 'application/json' }, body: JSON.stringify(args || {}) })
    .then(function (r) { return r.text().then(function (t) { var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) { } if (r.status === 401) { logout(); throw new Error('로그인이 만료됐어요'); } if (!r.ok) throw new Error((j && (j.message || j.error_description)) || '요청에 실패했어요'); return j; }); });
}
function login(email, pw) {
  return fetch(CFG.supabaseUrl + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: CFG.anonKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, password: pw }) })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error('이메일 또는 비밀번호가 맞지 않아요'); return j; }); })
    .then(function (j) {
      S.tok = j.access_token; S.email = email;
      return rpc('admin_me').then(function (ok) {
        if (!ok) { S.tok = null; throw new Error('관리자 권한이 없는 계정이에요'); }
        // 창을 닫으면 사라지는 저장소에만 두고, 토큰 만료 시각까지만 쓴다
        sessionStorage.setItem('detoxvs_admin', JSON.stringify({ tok: S.tok, email: email, exp: Date.now() + (j.expires_in || 3600) * 1000 - 60000 }));
      });
    });
}
function logout() { S.tok = null; try { sessionStorage.removeItem('detoxvs_admin'); } catch (e) { } render(); }

/* ---- 화면 ---- */
var NAV = [['home', '현황'], ['ask', '문의/제안'], ['report', '신고'], ['users', '사용자'], ['groups', '내기'], ['config', '공지·감지 설정']];
function render() {
  var app = $('#app');
  if (!DEMO && !(CFG.supabaseUrl && CFG.anonKey)) { app.innerHTML = setupView(); return; }
  if (!DEMO && !S.tok) { app.innerHTML = loginView(); return; }
  var st = S.stats || {};
  app.innerHTML = '<div class="wrap"><nav><div class="lg">디톡스vs<small>관리자</small></div>' + NAV.map(function (n) {
    var c = n[0] === 'ask' ? st.feedback_new : n[0] === 'report' ? st.reports_new : 0;
    return '<button class="' + (S.view === n[0] ? 'on' : '') + '" data-a="nav" data-v="' + n[0] + '"><span>' + n[1] + '</span>' + (c ? '<span class="cnt">' + c + '</span>' : '') + '</button>';
  }).join('') + '<div class="sp"></div><div class="who">' + esc(DEMO ? '데모 데이터' : S.email) + '</div>' + (DEMO ? '' : '<button data-a="logout">로그아웃</button>') + '</nav><main id="main"></main></div>';
  load();
}
function setupView() {
  return '<div class="login"><div class="card"><h1>디톡스vs 관리자</h1><p class="sub" style="margin-top:6px">서버 연결 정보가 아직 없어요. Supabase 프로젝트의 주소와 anon key 를 넣으면 이 브라우저에 저장돼요. (web/config.js 에 넣어 두면 이 화면은 안 나와요)</p>' +
    '<label>Supabase 주소</label><input class="inp" id="c_url" placeholder="https://xxxx.supabase.co"><label>anon key</label><input class="inp" id="c_key">' +
    '<button class="btn" data-a="saveCfg">저장</button><p style="margin-top:14px;text-align:center"><a href="?demo">데모 데이터로 둘러보기</a></p></div></div>';
}
function loginView() {
  return '<div class="login"><form class="card" id="lf"><h1>디톡스vs 관리자</h1><p class="sub" style="margin-top:6px">관리자로 등록된 계정만 들어올 수 있어요.</p>' +
    '<label>이메일</label><input class="inp" id="l_email" type="email" autocomplete="username" required><label>비밀번호</label><input class="inp" id="l_pw" type="password" autocomplete="current-password" required>' +
    '<button class="btn" type="submit">로그인</button><div class="err" id="l_err"></div></form></div>';
}
function head(title, right) { return (DEMO ? '<div class="demo">데모 데이터예요. 실제 서버와 연결돼 있지 않아요.</div>' : '') + '<div class="head"><h1>' + title + '</h1>' + (right || '') + '</div>'; }
function setMain(h) { var m = $('#main'); if (m) m.innerHTML = h; }
function fail(e) { setMain(head('문제가 생겼어요') + '<div class="card empty">' + esc(e.message || e) + '</div>'); }
function load() {
  var v = S.view;
  if (v === 'home') rpc('admin_stats').then(function (s) { var first = !S.stats; S.stats = s; if (first && (s.feedback_new || s.reports_new)) { render(); return; } homeView(s); }).catch(fail);
  else if (v === 'ask' || v === 'report') { S.fb.kind = v; fbLoad(); }
  else if (v === 'users') usLoad();
  else if (v === 'groups') grLoad();
  else if (v === 'config') Promise.all([rpc('admin_notice_get'), rpc('admin_config_get')]).then(function (a) { cfgView(a[0], a[1]); }).catch(fail);
}
function stat(l, v, s, alert) { return '<div class="card stat' + (alert ? ' alert' : '') + '"><div class="l">' + l + '</div><div class="v">' + (v == null ? '–' : Number(v).toLocaleString('ko-KR')) + '</div><div class="s">' + (s || '&nbsp;') + '</div></div>'; }
// 14일 막대: 한 지표에 한 차트(축을 섞지 않는다). 막대 위에 올리면 날짜와 값이 뜬다
function bars(series, key, unit) {
  var W = 560, H = 150, pad = 22, n = series.length, max = Math.max.apply(null, series.map(function (d) { return d[key]; }).concat([1])), bw = (W - 8) / n, h = '';
  series.forEach(function (d, i) {
    var v = d[key], bh = Math.max(v ? 3 : 0, (H - pad - 18) * v / max), x = 4 + i * bw, y = H - pad - bh, last = i === n - 1;
    h += '<rect class="hit" x="' + x + '" y="0" width="' + bw + '" height="' + (H - pad) + '" data-t="' + day(d.day) + ' · ' + v + unit + '"></rect>' +
      '<path class="bar" d="M' + (x + 2) + ' ' + (H - pad) + 'V' + (y + 4) + 'a4 4 0 0 1 4-4h' + Math.max(0, bw - 12) + 'a4 4 0 0 1 4 4V' + (H - pad) + 'z"' + (v ? '' : ' style="display:none"') + '></path>' +
      (last ? '<text class="val" x="' + (x + bw / 2) + '" y="' + (y - 5) + '" text-anchor="middle">' + v + '</text>' : '') +
      (i % 2 === (n - 1) % 2 ? '<text x="' + (x + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + day(d.day) + '</text>' : '');
  });
  return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="최근 14일 추이"><line x1="0" x2="' + W + '" y1="' + (H - pad) + '" y2="' + (H - pad) + '" stroke="#E6E9EE"></line>' + h + '</svg><div class="tip"></div></div>';
}
function homeView(s) {
  setMain(head('현황', '<span class="sub">' + dt(s.now) + ' 기준</span><button class="btn sec sm" data-a="nav" data-v="home">새로고침</button>') +
    '<div class="grid">' + stat('전체 사용자', s.users, '카카오 연결 ' + s.users_linked + '명') + stat('오늘 가입', s.new_today) + stat('오늘 이용', s.active_today, '측정값이 올라온 사람') + stat('최근 7일 이용', s.active_7d) +
    stat('진행 중 내기', s.groups_active, '1:1 ' + s.duels_active + '개') + stat('오늘 만든 내기', s.groups_new_today) + stat('새 문의', s.feedback_new, '', s.feedback_new > 0) + stat('새 신고', s.reports_new, '', s.reports_new > 0) + stat('정지 중', s.banned) + '</div>' +
    '<div class="two"><div class="card"><h2>하루 가입자</h2><div class="cap">최근 14일</div>' + bars(s.series, 'signups', '명') + '</div>' +
    '<div class="card"><h2>하루 이용자</h2><div class="cap">최근 14일, 측정값이 올라온 사람 수</div>' + bars(s.series, 'active', '명') + '</div></div>');
}
function pager(st, total) {
  return '<div class="pg"><span class="sub">' + (total ? (st.off + 1) + '–' + Math.min(total, st.off + PAGE) + ' / ' + total : '0') + '</span><button class="btn sec sm" data-a="pg" data-d="-1"' + (st.off ? '' : ' disabled') + '>이전</button><button class="btn sec sm" data-a="pg" data-d="1"' + (st.off + PAGE < total ? '' : ' disabled') + '>다음</button></div>';
}
function fbLoad() {
  var f = S.fb;
  rpc('admin_feedback', { p_kind: f.kind, p_status: f.status || null, p_limit: PAGE, p_offset: f.off }).then(function (r) {
    var rep = f.kind === 'report';
    setMain(head(rep ? '신고' : '문의/제안', '<div class="seg">' + [['new', '새 글'], ['done', '처리함'], ['', '전체']].map(function (o) { return '<button class="' + (f.status === o[0] ? 'on' : '') + '" data-a="fbStatus" data-v="' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div>') +
      '<div class="card">' + (r.rows.length ? r.rows.map(function (x) {
        return '<div class="fb"><div class="top"><b>' + esc(x.nickname || '탈퇴한 사용자') + '</b>' + (x.user_id ? '<button class="btn sec sm" data-a="user" data-id="' + x.user_id + '">내역</button>' : '') +
          '<span class="pill ' + (x.status === 'new' ? 'w' : 'g') + '">' + (x.status === 'new' ? '새 글' : '처리함') + '</span><span class="sub">' + dt(x.created_at) + (x.device ? ' · ' + esc(x.device) : '') + (x.app_version ? ' · v' + esc(x.app_version) : '') + '</span></div>' +
          '<div class="body">' + esc(x.body) + '</div>' +
